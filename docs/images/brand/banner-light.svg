<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" fill="none">
  <defs>
    <linearGradient id="kog-banner-bg-l" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="65%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <radialGradient id="kog-glow-l" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(975 140) rotate(90) scale(160 240)">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kog-mark-bg-l" x1="56" y1="48" x2="120" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="kog-shield-l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="kog-dots-l" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#CBD5E1" fill-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Card Container -->
  <rect x="1" y="1" width="1198" height="278" rx="20" fill="url(#kog-banner-bg-l)" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="740" y="16" width="444" height="248" rx="14" fill="url(#kog-dots-l)" opacity="0.7"/>
  <rect x="720" y="2" width="478" height="276" rx="18" fill="url(#kog-glow-l)"/>

  <!-- Left: Brand Mark (64x64) -->
